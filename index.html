<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKE Project</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Google Fonts: Serif for story, Mono for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="font-mono p-4 md:p-8 lg:p-12 box-border">

    <div class="max-w-2xl mx-auto w-full relative flex-grow flex flex-col">
        <!-- BOOK SELECTOR VIEW -->
        <div id="book-selector-view" class="flex-grow flex flex-col justify-center mb-16">
            <header class="mb-8 pb-4 border-b-2 border-white">
                <h1 class="text-3xl font-bold tracking-tight uppercase">Select Frequency</h1>
            </header>
            <div id="book-list" class="flex flex-col gap-4">
                <!-- Books injected here -->
            </div>
        </div>

        <!-- READING VIEW -->
        <div id="reading-view" class="hidden flex-grow flex flex-col">
            <!-- HEADER -->
            <header class="mb-12 pb-4 border-b-2 border-white flex justify-between items-end gap-4">
                <h1 class="text-2xl md:text-5xl font-bold tracking-tight uppercase" id="book-title"></h1>
                <button id="back-to-books-btn" class="text-xs md:text-sm uppercase text-gray-400 hover:text-white transition-colors pb-1 shrink-0">
                    ← Back
                </button>
            </header>

            <!-- SYSTEM MESSAGES -->
            <div id="messages" class="mb-8 hidden shrink-0 text-sm md:text-base">
                <div id="loading" class="app-msg-loading">Summoning text...
                </div>
                <div id="error" class="hidden app-msg-error"></div>
                <div id="success" class="hidden app-msg-success"></div>
            </div>

            <!-- NAVIGATION -->
            <nav id="chapter-nav" class="mb-12 flex flex-wrap gap-4 text-sm shrink-0">
                <!-- Chapter buttons dynamically injected here -->
            </nav>

            <!-- MAIN TEXT AREA -->
            <main id="story-container" class="font-serif text-gray-200 mb-16 flex-grow">
                <!-- Story text dynamically injected here -->
            </main>

            <!-- ACTIONS / FOOTER -->
            <footer id="actions" class="border-t-2 border-white pt-10 pb-16 hidden shrink-0">
                <div class="flex flex-col items-center">
                    <button id="transmit-btn"
                        class="px-6 py-4 font-bold text-lg w-full md:w-auto app-button tracking-wider">
                        Transmit Next Chapter
                    </button>

                    <div id="qr-wrapper" class="hidden w-full flex-col items-center mt-4">
                        <p class="app-qr-notice">
                            Carrier Signal Active. Awaiting Receiver.
                        </p>
                        <div class="bg-white p-6 app-border inline-block flex justify-center w-full max-w-[300px]">
                            <div id="qrcode"></div>
                        </div>
                        <button id="close-qr-btn" class="mt-8 px-4 py-2 text-sm app-button w-full md:w-auto tracking-widest">
                            Cease Transmission
                        </button>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- LOCATION OVERLAY -->
    <div id="location-overlay"
        class="fixed inset-0 z-50 hidden flex-col items-center justify-center p-6 text-white text-center font-mono">
        <!-- Background element overriding Tailwind opacity constraints if needed, or just standard bg -->
        <div class="absolute inset-0 bg-black opacity-95"></div>

        <div class="relative z-10 flex flex-col items-center">
            <h2 class="text-2xl md:text-3xl font-bold mb-4 uppercase tracking-widest">Sensors Offline</h2>
            <p class="mb-8 max-w-md font-serif text-lg md:text-xl text-gray-300">
                This frequency requires spatial awareness (Location Access) to synchronize. Provide clearance to
                transmit or receive new chapters.
            </p>
            <div class="flex flex-col gap-4 w-full max-w-sm">
                <button id="grant-location-btn" class="px-6 py-4 font-bold text-lg app-button tracking-wider w-full">
                    Grant Location
                </button>
                <button id="dismiss-location-btn"
                    class="px-6 py-3 text-sm app-border bg-transparent text-gray-400 transition-colors uppercase cursor-pointer hover:border-white hover:text-white w-full tracking-widest">
                    Read Unlocked Chapters
                </button>
            </div>
            <div id="location-error-text"
                class="mt-8 text-[var(--accent-error)] text-sm max-w-md uppercase font-bold hidden"></div>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script src="config.js"></script>
    <script src="index.js"></script>
</body>

</html>
